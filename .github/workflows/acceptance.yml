name: Isolated Windows acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-acceptance
  cancel-in-progress: false

jobs:
  native:
    name: Native install and PATH recovery
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CCM_RUN_INSTALL_SMOKE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
          shared-key: windows
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify user PATH apply, restore and external-change conflict
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked isolated_path_smoke -- --ignored --nocapture --test-threads=1
      - name: Verify official bootstrap, install, reinstall, downgrade and upgrade
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked native_install_smoke -- --ignored --nocapture --test-threads=1
