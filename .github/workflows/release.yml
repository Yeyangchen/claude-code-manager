name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed Windows draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify main ancestry
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
          shared-key: windows
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-project.mjs
      - run: node scripts/check-security-exceptions.mjs
      - run: node --test scripts/release.test.mjs
      - run: node --test scripts/generate-notices.test.mjs
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: node scripts/generate-notices.mjs --check
      - run: pnpm build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri:build --bundles nsis --config src-tauri/tauri.release.conf.json
      - run: node scripts/release.mjs
      - name: Upload immutable draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
